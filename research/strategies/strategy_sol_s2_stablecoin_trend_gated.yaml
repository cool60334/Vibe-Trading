name: sol_s2_stablecoin_trend_gated
archetype: multi_factor_consensus
hypothesis: >
  SOL analog of the proven btc_s9 winner. Stage-1 retained stablecoin_supply_z
  (SOL's strongest factor: daily IC +0.080, IR 3.44) and bollinger_band_width
  (volatility-expansion trend factor, IC72 +0.036). The sol_s1 scaffold used
  logic:any across 3 factors and overtraded (3800 trades, train sharpe -1.7,
  OOS -92.7%) — fees ate the weak edges. This spec tightens to a 2-factor
  AND-consensus (logic:all) on the two POSITIVE-IC trend factors only, dropping
  the atr contrarian leg that fought the trend. Economic logic: go long only
  when fresh capital is entering (high stablecoin z) AND volatility is expanding
  to confirm the move (high bb_width); short the mirror. AND-gating cuts trade
  count drastically so the modest edges survive cost.
symbol: SOL-USDT-SWAP
timeframe_signal: 8h
hold_period:
  min_hours: 24
  max_hours: 120
indicators:
  stablecoin_supply_zscore:
    source: stage1:stablecoin_supply_zscore
    smoothing: sma_3
  bollinger_band_width:
    source: stage1:bollinger_band_width
    smoothing: sma_3
entry_long:
  description: >
    Capital inflowing (high stablecoin z) AND volatility expanding (high
    bb_width) — both confirm an upmove. 120-day percentile window, persistence.
  logic: all
  conditions:
  - stablecoin_supply_zscore_percentile_120d >= 75 persist 2/3
  - bollinger_band_width_percentile_120d >= 70 persist 2/3
entry_short:
  description: >
    Capital leaving (low stablecoin z) AND volatility compressing (low
    bb_width). 120-day percentile window, persistence.
  logic: all
  conditions:
  - stablecoin_supply_zscore_percentile_120d <= 25 persist 2/3
  - bollinger_band_width_percentile_120d <= 30 persist 2/3
exit_rules:
- condition: time_based
  max_hold_hours: 120
- condition: take_profit_pct
  value: 7.0
- condition: stop_loss_pct
  value: 3.0
position_sizing:
  method: fixed_risk
  risk_per_trade_pct: 1.5
  leverage: 1.0
parameter_search_ranges:
  lookback_days:
  - 90
  - 150
  - 30
  entry_high_pct:
  - 70
  - 85
  - 5
  entry_low_pct:
  - 15
  - 30
  - 5
  hold_max_hours:
  - 96
  - 144
  - 24
  tp_pct:
  - 6.0
  - 9.0
  - 1.5
  sl_pct:
  - 2.0
  - 3.5
  - 0.5
expected_behavior:
  trades_per_year_estimate: 30
  expected_sharpe: 0.8
  expected_max_dd_pct: 17.0
  expected_win_rate_pct: 51
caveats:
- Both factors are ensemble_only (modest IC). The edge, if any, is from the
  AND-gate keeping trades sparse and aligned with capital inflow + vol expansion.
- Calibrate thresholds via stage-4 sweep; do not trust the scaffold defaults.
