name: btc_s7_stablecoin_funding_gated
archetype: multi_factor_consensus
hypothesis: >
  Two-factor AND-consensus that uses the NEW perp-derived funding_z factor to
  GATE the proven stablecoin_supply_z trend factor. stablecoin_supply_z has the
  strongest honest 4yr BTC IC (+0.072@168h, trend: capital inflow -> price up).
  funding_z is the strongest NEW derived factor (IC72 -0.0515, contrarian:
  stretched-positive funding = crowded longs -> reversion risk). Economic logic:
  go long only when fresh capital is entering (high stablecoin z) AND positioning
  is NOT crowded-long (low funding z, room to run); go short only when capital is
  leaving (low stablecoin z) AND longs are crowded (high funding z, squeeze risk).
  Requiring both factors to agree (logic: all) cuts the OR-of-4 over-trading that
  blew up btc_s1 (-99.95%, 5421 trades). Leverage 1.0, no signal_invalidation
  exit (the churn source in s1). Edge is modest (both ensemble_only); hypothesis
  test of whether the new funding_z gate improves the stablecoin trend.
symbol: BTC-USDT-SWAP
timeframe_signal: 8h
hold_period:
  min_hours: 24
  max_hours: 120
indicators:
  stablecoin_supply_z:
    source: stage1:stablecoin_supply_z
    smoothing: sma_3
  funding_z:
    source: stage1:funding_z
    smoothing: sma_3
entry_long:
  description: >
    Capital inflowing (high stablecoin z, trend) AND longs not crowded
    (low funding z, contrarian agrees bullish). Both must hold, with persistence.
  logic: all
  conditions:
  - stablecoin_supply_z_percentile_90d >= 80 persist 2/3
  - funding_z_percentile_90d <= 20 persist 2/3
entry_short:
  description: >
    Capital leaving (low stablecoin z) AND longs crowded (high funding z,
    squeeze risk). Both must hold, with persistence.
  logic: all
  conditions:
  - stablecoin_supply_z_percentile_90d <= 20 persist 2/3
  - funding_z_percentile_90d >= 80 persist 2/3
exit_rules:
- condition: time_based
  max_hold_hours: 120
- condition: take_profit_pct
  value: 6.0
- condition: stop_loss_pct
  value: 3.0
position_sizing:
  method: fixed_risk
  risk_per_trade_pct: 1.5
  leverage: 1.0
parameter_search_ranges:
  lookback_days:
  - 60
  - 120
  - 30
  entry_high_pct:
  - 75
  - 90
  - 5
  entry_low_pct:
  - 10
  - 25
  - 5
  hold_max_hours:
  - 96
  - 168
  - 24
  tp_pct:
  - 5.0
  - 9.0
  - 2.0
  sl_pct:
  - 2.5
  - 4.5
  - 1.0
expected_behavior:
  trades_per_year_estimate: 25
  expected_sharpe: 0.5
  expected_max_dd_pct: 12.0
  expected_win_rate_pct: 50
caveats:
- Deterministic scaffold-style thresholds; calibrate via stage-4 sweep + judge on
  the walk-forward OOS holdout, not in-sample.
- 2-factor AND can go sparse if the two extremes rarely co-occur; watch trade_count.
- Both factors are ensemble_only (modest edge). The funding_z gate is the new
  contribution being tested vs the s2 single-factor stablecoin baseline.
