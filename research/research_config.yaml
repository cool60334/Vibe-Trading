# research/research_config.yaml
# 管線種子設定檔 — D5 決策：只放 seed inputs，階段間決策走 JSON handoff。
# 修改此檔可重新定向整條管線，不需改任何 .py 原始碼。

# ─── 研究幣種清單 ──────────────────────────────────────────────────────────────
# 管線對每個幣種跑一輪，產出檔名帶幣種前綴（btc_、eth_）互不覆蓋。
# 每個 symbol entry 需包含：
#   name      : 短名（小寫），用作檔名前綴與 run 目錄前綴
#   okx_swap  : OKX 永續合約代碼（REST / funding history 使用）
#   ccxt_bybit: ccxt 統一格式的 Bybit 永續合約代碼（OI history 使用）
symbols:
- name: btc
  okx_swap: "BTC-USDT-SWAP"
  ccxt_bybit: "BTC/USDT:USDT"

- name: eth
  okx_swap: "ETH-USDT-SWAP"
  ccxt_bybit: "ETH/USDT:USDT"

- name: sol
  okx_swap: "SOL-USDT-SWAP"
  ccxt_bybit: "SOL/USDT:USDT"

# ── 擴充幣種（coin_scout 2026-06-23 判 GO：OKX OHLCV/ccxt Binance funding/Binance OI archive 三源覆蓋皆 ≥730d）──
- name: bnb
  okx_swap: "BNB-USDT-SWAP"
  ccxt_bybit: "BNB/USDT:USDT"

- name: xrp
  okx_swap: "XRP-USDT-SWAP"
  ccxt_bybit: "XRP/USDT:USDT"

- name: doge
  okx_swap: "DOGE-USDT-SWAP"
  ccxt_bybit: "DOGE/USDT:USDT"

- name: ada
  okx_swap: "ADA-USDT-SWAP"
  ccxt_bybit: "ADA/USDT:USDT"

- name: ltc
  okx_swap: "LTC-USDT-SWAP"
  ccxt_bybit: "LTC/USDT:USDT"

- name: bch
  okx_swap: "BCH-USDT-SWAP"
  ccxt_bybit: "BCH/USDT:USDT"

# ─── 資料抓取參數 ──────────────────────────────────────────────────────────────
period: 1460         # 回溯天數（約 4 年）— funding 改 ccxt 多年源後可拉長；2022-05 起資料
interval: "1H"       # K 線週期（OKX bar 格式）
# Walk-forward train/OOS split: 在 oos_start 之前為 in-sample TRAIN 窗（stage4 只在此選參），
# 之後為 held-out OOS 窗（stage4 自動用 best params 回測驗證，寫入 manifest.walk_forward）。
# 留空 / 移除 = 不切分（legacy：全期選參）。資料 2022-06 起，此設 ≈ 2.5yr train / 1.4yr OOS。
oos_start: "2025-01-01"
data_source: okx     # 資金費率 & K 線來源；OI + L/S 持倉比來自 Binance daily-metrics archive（Bybit 為 fallback）

# ─── 窗口凍結與終極 holdout（A2+A3，已啟用 2026-07-07） ─────────────────────
window_end: "2026-04-01"          # 凍結回測窗口錨定日：一個迭代週期內所有 run 同窗，
                                  # 週期結束人工滾動。未設 = 用執行當日（legacy）。
                                  # 錨定被 cap 到 final_holdout_start - 1 = 2026-03-31。
final_holdout_start: "2026-04-01" # 此日之後的資料任何 pipeline 窗口都碰不到；
                                  # 只能由 python -m research.pipeline.final_holdout
                                  # 在 promote 前手動花費一次。保留 ≈3.3 月終極 holdout。

# ─── 回測引擎 ──────────────────────────────────────────────────────────────────
engine: daily        # backtest.runner 引擎模式（daily / hourly）

# ─── 交易成本（OKX 掛單 / 吃單 / 滑點，單位：比率） ──────────────────────────
fees:
  maker_rate: 0.0002   # BTC 永續掛單手續費 0.02%
  taker_rate: 0.00055  # BTC 永續吃單手續費 0.055%
  slippage:   0.0005   # 預設滑點估計 0.05%

# ─── 成本模型 gating（A1，default = realistic） ──────────────────────────────
# 預設（不設此欄）= 真實成本：config fees 雙邊 taker + 真 funding 序列。
# legacy_costs: true   # 除錯後門：退回引擎硬編碼舊費率，重現舊回測數字。日常勿開。

# ─── 因子分析 Horizons ──────────────────────────────────────────────────────────
# IC/IR 計算所用的前向報酬時窗（小時）
horizons_h: [8, 24, 72, 168]

# ─── Stage 0 探索快取 ────────────────────────────────────────────────────────
discovery_cache_days: 7    # 重跑間隔天數（0 = 永不快取）

# ─── Stage 0 deterministic selector 門檻（可選） ──────────────────────────────
# Stage 0 已從 LLM swarm 主導翻轉為 deterministic top-K from evidence。下列
# 區塊覆寫 select_candidates_from_evidence 的預設門檻；省略此區塊用內建預設。
# 見 research/PIPELINE.md「Stage 0」章節。
# stage0_selector:
#   min_abs_ic: 0.05      # 預設 0.05；過 |IC| 門檻才入選
#   min_abs_ir: 0.10      # 預設 0.10；過 |IR| 門檻才入選
#   max_candidates: 6     # 預設 6；最多挑幾個因子

# ─── 技術指標池（evidence-driven factor discovery） ──────────────────────────
# 列出啟用的短名稱指標；indicators.py 依此清單計算特徵。
# 省略此區塊則使用下列預設 13 個指標。
# indicator_pool:
#   # momentum
#   - rsi_14
#   - macd_diff
#   - roc_10
#   - stoch_k
#   # trend
#   - ema_cross_9_21
#   - sma_cross_10_30
#   - adx_14
#   # volatility
#   - atr_14
#   - bb_width_20
#   - rolling_std_20
#   # volume
#   - obv
#   - mfi_14
#   - volume_zscore_20

# ─── Feature Store 路徑 ──────────────────────────────────────────────────────
# 計算好的指標特徵快取目錄（相對 repo root）。
# feature_store_path: "research/manifests"   # 預設值

# ─── Feature 覆蓋率門檻 ──────────────────────────────────────────────────────
# 新增一欄特徵時，非 NaN 比例必須達到此閾值才接受（0.0–1.0）。
# append_coverage_threshold: 0.5   # 預設 50%

# ─── 策略級 lag-stress（stage3 --lag-stress） ─────────────────────────────────
# 進場延遲壓測的 bar 數清單；stage3 用來驗證訊號在延遲 N 根 K 線進場後是否仍存活。
lag_stress_bars: [1, 2]   # entry-delay stress in bars (stage3 --lag-stress)
