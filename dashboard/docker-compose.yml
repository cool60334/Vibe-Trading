services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      REPO_ROOT: /repo
      CORS_ORIGINS: http://localhost
      # Trading mode (paper=mainnet dry-run default; testnet/live need keys)
      TRADING_MODE: ${TRADING_MODE:-paper}
      PAPER_EQUITY: ${PAPER_EQUITY:-10000}
      PAPER_TAKER_FEE: ${PAPER_TAKER_FEE:-0.00055}
      PAPER_SLIPPAGE_BPS: ${PAPER_SLIPPAGE_BPS:-5}
      # Forward Bybit credentials to supervisor subprocesses (testnet/live only)
      BYBIT_API_KEY: ${BYBIT_API_KEY:-}
      BYBIT_API_SECRET: ${BYBIT_API_SECRET:-}
    volumes:
      # Mount repo root read-only so server can read research/ and runs/
      - ..:/repo:ro
      # Writable mount for testnet output (runs/testnet/)
      - ../runs:/repo/runs
      # Persist promote state + exports across container rebuilds
      - ./data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

  # NOTE: the trader runs in its OWN compose file (docker-compose.trader.yml) so
  # that redeploying the dashboard (server/web) never recreates — and thus never
  # kills — a running dry-run. The server here only WRITES control files into
  # ../runs; the trader container reconciles processes to them.
